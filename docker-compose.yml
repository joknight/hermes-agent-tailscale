services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: hermes-tailscale
    hostname: hermes
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      TS_HOSTNAME: hermes
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    command:
      - /bin/sh
      - -ec
      - |
        tailscaled --state=/var/lib/tailscale/tailscaled.state &
        daemon_pid=$$!
        trap 'kill "$$daemon_pid" 2>/dev/null || true' TERM INT EXIT
        until tailscale --socket=/var/run/tailscale/tailscaled.sock status >/dev/null 2>&1; do
          sleep 1
        done
        tailscale up --auth-key="$$TS_AUTHKEY" --hostname="$$TS_HOSTNAME"
        tailscale serve --bg http://127.0.0.1:9119
        wait "$$daemon_pid"
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      - ${HERMES_DATA_DIR:-./hermes-data}:/opt/data
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_HOME: /opt/data
    command: ["gateway", "run"]

volumes:
  tailscale-state:
